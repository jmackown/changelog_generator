# On-merge mode (recommended)
#
# How it works:
#   On push to main, extracts the PR number from the merge commit message,
#   generates a changelog entry with AI summary and GitHub metadata,
#   and writes it directly to CHANGELOG.md.
#
# Works with both merge commits and squash merges.
# Concurrent merges are serialised via concurrency group.
#
# Copy this file to .github/workflows/changelog.yml in your repository.

name: Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: jmackown/changelog_generator/.github/workflows/changelog.yml@main
    with:
      with-summaries: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
