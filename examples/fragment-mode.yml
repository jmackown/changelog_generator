# Fragment mode (recommended)
#
# How it works:
#   1. On PR open/update: generates a .changelog/pr-{N}.md fragment on the PR branch
#   2. On merge to main: assembles all fragments into CHANGELOG.md
#
# Fragments avoid merge conflicts because each PR only touches its own file.
# The assembly step serializes via concurrency, so simultaneous merges are safe.
#
# Copy this file to .github/workflows/changelog.yml in your repository.

name: Changelog

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  changelog:
    uses: jmackown/changelog_generator/.github/workflows/changelog.yml@main
    with:
      mode: fragment
      with-summaries: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
