# Update branch mode
#
# Generates the changelog entry and commits it to the PR branch before merge.
# The changelog update ships as part of the PR itself.
#
# Requires the PR number to be passed explicitly. Typically triggered via
# workflow_dispatch or as part of a larger CI pipeline.
#
# Copy this file to .github/workflows/changelog.yml in your repository.

name: Changelog

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  changelog:
    uses: jmackown/changelog_generator/.github/workflows/changelog.yml@main
    with:
      mode: update-branch
      pr-number: ${{ github.event.pull_request.number }}
      with-summaries: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
