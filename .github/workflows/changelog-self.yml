name: Changelog (this repo)

on:
  push:
    branches: [main]

jobs:
  changelog:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-update
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR number from merge commit
        id: pr
        run: |
          SUBJECT=$(git log -1 --format='%s')
          echo "Commit subject: $SUBJECT"
          PR_NUM=$(echo "$SUBJECT" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' || true)
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(echo "$SUBJECT" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+' || true)
          fi
          if [ -z "$PR_NUM" ]; then
            echo "No PR number found, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Found PR #$PR_NUM"
            echo "number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true'
        run: pip install requests

      - name: Generate changelog entry
        if: steps.pr.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python changelog/run.py \
            --for-pr ${{ steps.pr.outputs.number }} \
            --with-summaries

      - name: Commit changelog
        if: steps.pr.outputs.skip != 'true'
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md .changelog-summaries.json
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add CHANGELOG.md .changelog-summaries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update changelog for PR #${{ steps.pr.outputs.number }} [skip ci]"
            git push
          fi
