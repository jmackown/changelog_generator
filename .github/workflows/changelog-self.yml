name: Changelog (this repo)

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  # Generate a fragment on the PR branch
  generate-fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate fragment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python changelog/run.py \
            --fragment \
            --for-pr ${{ github.event.pull_request.number }}

      - name: Commit fragment
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add .changelog/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: add changelog fragment for PR #${{ github.event.pull_request.number }} [skip ci]"
            git push
          fi

  # Assemble fragments on merge to main
  assemble-changelog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-assemble
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Assemble changelog
        run: python changelog/run.py --assemble

      - name: Commit assembled changelog
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md .changelog/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update changelog [skip ci]"
            git push
          fi
