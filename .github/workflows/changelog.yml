name: Generate Changelog

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      with-summaries:
        description: 'Generate AI summaries'
        required: false
        type: boolean
        default: true
      model:
        description: 'LLM model to use'
        required: false
        type: string
        default: 'claude-haiku-4-5-20251001'
      provider:
        description: 'LLM provider (anthropic, openai, gemini). Auto-detects from API keys if not set.'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for AI summaries'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI API key (alternative to Anthropic)'
        required: false
      GEMINI_API_KEY:
        description: 'Gemini API key (alternative to Anthropic/OpenAI)'
        required: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    concurrency:
      group: changelog-update
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PR number from merge commit
        id: pr
        run: |
          SUBJECT=$(git log -1 --format='%s')
          echo "Commit subject: $SUBJECT"
          # Try merge commit format: "Merge pull request #N from ..."
          PR_NUM=$(echo "$SUBJECT" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' || true)
          # Fall back to squash merge format: trailing "(#N)"
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(echo "$SUBJECT" | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+' || true)
          fi
          if [ -z "$PR_NUM" ]; then
            echo "No PR number found in commit message, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Found PR #$PR_NUM"
            echo "number=$PR_NUM" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout changelog_generator
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: jmackown/changelog_generator
          path: .changelog_generator
          sparse-checkout: |
            changelog/run.py

      - name: Set up Python
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}

      - name: Install dependencies
        if: steps.pr.outputs.skip != 'true'
        run: pip install requests

      - name: Generate changelog entry
        if: steps.pr.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .changelog_generator/changelog/run.py \
            --for-pr ${{ steps.pr.outputs.number }} \
            ${{ inputs.with-summaries && '--with-summaries' || '' }} \
            ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }} \
            ${{ inputs.with-summaries && format('--model {0}', inputs.model || 'claude-haiku-4-5-20251001') || '' }}

      - name: Cleanup
        if: steps.pr.outputs.skip != 'true'
        run: rm -rf .changelog_generator

      - name: Commit changelog
        if: steps.pr.outputs.skip != 'true'
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md .changelog-summaries.json
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add CHANGELOG.md .changelog-summaries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update changelog for PR #${{ steps.pr.outputs.number }} [skip ci]"
            git push
          fi
