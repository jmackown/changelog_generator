name: Generate Changelog

on:
  # Note: push trigger is intentionally disabled for the changelog_generator repo itself
  # This workflow is designed to be called FROM other repositories via workflow_call
  # push:
  #   branches:
  #     - main
  workflow_dispatch:  # Allow manual triggers for testing
  workflow_call:  # Allow other repos to call this workflow
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      with-summaries:
        description: 'Generate AI summaries'
        required: false
        type: boolean
        default: true
      model:
        description: 'LLM model to use'
        required: false
        type: string
        default: 'claude-3-5-haiku-20241022'
      provider:
        description: 'LLM provider (anthropic, openai, gemini). Auto-detects from API keys if not set.'
        required: false
        type: string
        default: ''
      mode:
        description: 'How to commit changelog: direct-commit (to main), pull-request (separate PR), update-branch (to PR branch)'
        required: false
        type: string
        default: 'direct-commit'
      pr-number:
        description: 'PR number (required for update-branch mode)'
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for AI summaries'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI API key (alternative to Anthropic)'
        required: false
      GEMINI_API_KEY:
        description: 'Gemini API key (alternative to Anthropic/OpenAI)'
        required: false

jobs:
  changelog:
    runs-on: ubuntu-latest

    # Skip if commit message contains [skip ci] or [changelog skip]
    # Only apply this check when triggered by push (not workflow_call)
    if: "github.event_name == 'workflow_call' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[changelog skip]'))"

    permissions:
      contents: write  # Required to create branches and commits
      pull-requests: write  # Required to create PRs
      actions: read  # Required to read workflow runs

    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to find last changelog commit
          token: ${{ secrets.GITHUB_TOKEN }}
          # For update-branch mode, checkout the PR's head branch
          ref: ${{ inputs.mode == 'update-branch' && format('refs/pull/{0}/head', inputs.pr-number) || '' }}

      - name: Checkout PR branch for update-branch mode
        if: inputs.mode == 'update-branch' && inputs.pr-number != ''
        run: |
          # Get the PR's head branch name and check it out
          PR_BRANCH=$(gh pr view ${{ inputs.pr-number }} --json headRefName -q '.headRefName')
          git checkout -B "$PR_BRANCH"
          git pull origin "$PR_BRANCH" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout changelog_generator for changelog script
        uses: actions/checkout@v4
        with:
          repository: jmackown/changelog_generator
          path: .changelog_generator
          sparse-checkout: |
            changelog/run.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate changelog (update-branch mode)
        if: inputs.mode == 'update-branch' && inputs.pr-number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .changelog_generator/changelog/run.py \
            --for-pr ${{ inputs.pr-number }} \
            ${{ inputs.with-summaries && '--with-summaries' || '' }} \
            ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }} \
            ${{ inputs.with-summaries && format('--model {0}', inputs.model || 'claude-3-5-haiku-20241022') || '' }}

      - name: Generate changelog (direct-commit or pull-request mode)
        if: inputs.mode != 'update-branch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .changelog_generator/changelog/run.py \
            --since-last-commit \
            ${{ inputs.with-summaries && '--with-summaries' || '' }} \
            ${{ inputs.provider && format('--provider {0}', inputs.provider) || '' }} \
            ${{ inputs.with-summaries && format('--model {0}', inputs.model || 'claude-3-5-haiku-20241022') || '' }}

      - name: Cleanup temporary files
        run: |
          rm -rf .changelog_generator

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit to PR branch (update-branch mode)
        if: steps.check_changes.outputs.has_changes == 'true' && inputs.mode == 'update-branch' && inputs.pr-number != ''
        run: |
          PR_BRANCH=$(gh pr view ${{ inputs.pr-number }} --json headRefName -q '.headRefName')
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md .changelog-summaries.json
          git commit -m "docs: add changelog entry for PR #${{ inputs.pr-number }} [skip ci]"
          git push origin "$PR_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Direct commit to main (direct-commit mode)
        if: steps.check_changes.outputs.has_changes == 'true' && inputs.mode == 'direct-commit'
        run: |
          git config user.name "changelog-bot"
          git config user.email "changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md .changelog-summaries.json
          git commit -m "docs: update changelog [skip ci]"
          git push

      - name: Create Pull Request (pull-request mode)
        if: steps.check_changes.outputs.has_changes == 'true' && inputs.mode == 'pull-request'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: update changelog [skip ci]"
          committer: changelog-bot <changelog-bot@users.noreply.github.com>
          author: changelog-bot <changelog-bot@users.noreply.github.com>
          title: "chore: update changelog"
          body: |
            ## 🤖 Automated Changelog Update

            This PR updates the changelog with recently merged PRs.

            **Changes:**
            - Updated `CHANGELOG.md` with latest entries
            - Updated `.changelog-summaries.json` cache (if AI summaries enabled)

            **Generated by:** changelog-bot
            **Triggered by:** Merge to main

            ---
            *This PR will auto-merge if auto-merge is enabled and all checks pass.*
          branch: changelog-updates
          base: main
          delete-branch: true
          labels: |
            automated
            documentation
          token: ${{ secrets.GITHUB_TOKEN }}
